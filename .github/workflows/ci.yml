name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Windows tests
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      EVENT_NAME: ${{ github.event_name }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      TESTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Record tested revisions
        run: |
          Write-Output "event=$env:EVENT_NAME"
          Write-Output "pr_head=$env:PR_HEAD_SHA"
          Write-Output "pr_base=$env:PR_BASE_SHA"
          Write-Output "tested=$env:TESTED_SHA"
          python --version
          git --version
      - name: Capture behavior
        run: python tests/test_capture.py
      - name: Push guard behavior
        run: python .codex/hooks/test_pre_push_guard.py
