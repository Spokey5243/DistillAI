[project]
name = "distillai"
version = "0.1.0"
description = "Personal knowledge and cognition maintenance"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.14.2",
    "apscheduler>=3.11,<4",
    "boltons>=26.2.0",
    "fastapi>=0.143.2",
    "fastmcp>=4.1.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jsonschema>=4.26.0",
    "loguru>=0.7.3",
    "networkx>=3.7",
    "pathvalidate>=3.3.1",
    "portalocker>=4.4.1",
    "pydantic>=2.12",
    "pydantic-settings>=2.16.0",
    "pywin32>=311 ; sys_platform == 'win32'",
    "uvicorn>=0.41.0",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811"]

[dependency-groups]
browser = [
    "playwright>=1.64.0",
]
dev = [
    "ruff>=0.17.1",
]
